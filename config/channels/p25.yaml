# P25 Trunking — Pierce County / Tacoma area
# Device: NooElec v5 #1 (control channel) + NooElec v5 #2 (voice channel)
# Decoder: Trunk Recorder (built with mbelib for software voice decode)
#
# Confirmed:
#   - Police:  P25 Phase 2 (TDMA, AMBE+2 codec) — 800 MHz
#   - Fire:    P25 Phase 1 (IMBE codec) — 800 MHz
#   - Antenna: 860 MHz spider ground plane (8.7 cm elements)
#   - Both services share the same P25 trunked system infrastructure
#
# TODO: Fill in from radioreference.com/db/browse/ctid/1694 (Pierce County):
#   - Exact control channel frequency(ies)
#   - Voice channel frequency list
#   - WACN, System ID, NAC
#   - Talkgroup IDs for police dispatch, fire dispatch, EMS, PCSO

device_control: p25_control    # NooElec v5 #1 — locked on control channel
device_voice:   p25_voice      # NooElec v5 #2 — follows assigned voice channels
decode_encrypted: false

band_mhz: 800
rx_range_mhz: [851, 869]       # tower transmit range (what we receive)

systems:
  - name: "Pierce County P25"
    phase: mixed                # Phase 2 for police, Phase 1 for fire — TR handles both
    wacn: null                  # TODO: from radioreference.com
    sysid: null                 # TODO: from radioreference.com
    nac: null                   # TODO: from radioreference.com
    control_channels: []        # TODO: from radioreference.com

    talkgroups:
      # TODO: Add talkgroup IDs from radioreference.com
      # Examples of what to look for:
      #   - Tacoma PD Dispatch (Phase 2)
      #   - Tacoma PD TAC 1, TAC 2, ...
      #   - Tacoma Fire Dispatch (Phase 1)
      #   - Pierce County SO Dispatch
      #   - Pierce County EMS
      # Omit encrypted talkgroups (labeled "E" on radioreference.com)

# Trunk Recorder config reference (generated separately in config/trunk-recorder.json)
# Key settings:
#   controlWarnRate: -1        (suppress missed control channel warnings)
#   captureDir: /home/c_zal/SDRScanner/recordings
#   modulation: P25            (handles Phase 1 and Phase 2 automatically)
