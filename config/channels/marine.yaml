# Marine VHF — Puget Sound / Tacoma area
# ITU/FCC channel plan, 156-174 MHz
# Modulation: NFM (narrowband FM), 5 kHz deviation
# VHF Marine simplex: Rx = Tx frequency

device: marine
squelch_db: -55
scan_mode: priority

channels:
  # --- Priority / Safety channels ---
  - name: "Ch 16 — Distress/Calling"
    freq_mhz: 156.800
    priority: true
    notes: "International distress, safety, and calling — monitor always"

  - name: "Ch 22A — USCG Working"
    freq_mhz: 157.100
    priority: true
    notes: "US Coast Guard liaison — Sector Puget Sound"

  # --- USCG / Traffic ---
  - name: "Ch 83A — USCG"
    freq_mhz: 157.175
    priority: false

  - name: "Ch 21A — USCG"
    freq_mhz: 157.050
    priority: false

  # --- Port / Commercial working channels ---
  - name: "Ch 14 — Vessel Traffic"
    freq_mhz: 156.700
    priority: true
    notes: "Puget Sound VTS (Vessel Traffic Service) — Seattle/Tacoma"

  - name: "Ch 12 — Vessel Traffic"
    freq_mhz: 156.600
    priority: false
    notes: "Secondary VTS / port operations"

  - name: "Ch 20A — Port Operations"
    freq_mhz: 157.000
    priority: false
    notes: "Tacoma port operations"

  - name: "Ch 17 — State Control"
    freq_mhz: 156.850
    priority: false

  # --- Commercial / commercial fishing ---
  - name: "Ch 06 — Intership Safety"
    freq_mhz: 156.300
    priority: false

  - name: "Ch 08 — Commercial Working"
    freq_mhz: 156.400
    priority: false

  - name: "Ch 67 — Boater Safety"
    freq_mhz: 156.375
    priority: false

  - name: "Ch 68 — Non-commercial"
    freq_mhz: 156.425
    priority: false

  - name: "Ch 69 — Non-commercial"
    freq_mhz: 156.475
    priority: false

  - name: "Ch 71 — Non-commercial"
    freq_mhz: 156.575
    priority: false

  - name: "Ch 72 — Non-commercial"
    freq_mhz: 156.625
    priority: false

  - name: "Ch 78A — Non-commercial"
    freq_mhz: 156.925
    priority: false

  # --- Puget Sound Ferry (WSF) ---
  - name: "WSF Operations"
    freq_mhz: 156.650
    priority: false
    notes: "Washington State Ferries — Ch 13 bridge-to-bridge"

  - name: "Ch 13 — Bridge-to-Bridge"
    freq_mhz: 156.650
    priority: false
    notes: "Navigation safety, 1W only"

# AIS is handled separately by rtl-ais on same device
ais:
  enabled: true
  ch_87b_mhz: 161.975
  ch_88b_mhz: 162.025
  notes: "rtl-ais decodes both AIS channels simultaneously within one 2 MHz capture"
