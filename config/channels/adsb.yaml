# ADS-B — 1090 MHz Aircraft Tracking
# Device: adsb (NooElec NESDR SMArt v5, serial RTLSDR_ADSB — see config/devices.yaml)
# Decoded by: dump1090 (source-built per scripts/install.sh — this box does
# NOT have the packaged dump1090-fa service, so no built-in HTTP JSON server;
# --write-json is used instead, see below)
# Display: src/display/adsb_map.py — full-screen Python/pygame app on the
# HDMI monitor, reads the JSON file directly (no web server involved).

device: adsb

dump1090:
  freq_mhz: 1090.0
  gain: 49.6                  # typical good starting point; tune per antenna
  ppm: 0
  net: true                   # enable network output ports
  net_port_beast: 30005       # Beast binary output (for feeders)
  net_port_sbs: 30003         # SBS-1 BaseStation format
  net_port_raw: 30002         # Raw AVR format
  write_json_dir: "run/adsb-json"   # relative to repo root — see scripts/start_scanner.sh
  write_json_every: 1

antenna:
  type: "1090 MHz collinear or cantenna"
  notes: >
    A simple quarter-wave ground plane (6.9 cm radiator, 4× 6.9 cm radials)
    works well. A spider antenna or coax collinear improves range significantly.
    Mount as high and in the open as possible for maximum range.

# Feeders — all three read the same dump1090-fa Beast output (port 30005),
# each a lightweight forwarding daemon, no extra decode cost:
feeders:
  flightaware:
    enabled: true
    client: piaware
    note: "Requires a FlightAware account to claim the feeder (free); grants free Enterprise-tier data access in return."
  flightradar24:
    enabled: true
    client: fr24feed
    note: "Requires an FR24 account + sharing key (free); grants free Business-tier access in return."
  adsbexchange:
    enabled: true
    client: adsbx-feed
    note: "No account needed. Does not honor aircraft-blocking requests (military/gov included)."

mlat:
  enabled: true               # feeding aggregator networks — mlat helps position non-ADS-B-equipped aircraft
  receiver_lat: 47.25         # Tacoma approximate — update with exact location
  receiver_lon: -122.44
  receiver_alt_m: 50          # update with actual antenna height MSL
