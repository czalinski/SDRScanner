# SDR Device Assignment Configuration
# Set serial numbers with: rtl_eeprom -d <index> -s <serial>
# Then update serial fields below to match.

devices:
  - id: railroad
    serial: "RTLSDR_RR"        # RTL-SDR.COM V3 #1
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "BNSF Railroad scanner"
    antenna: "J-pole #1 (built, tested 2026-11-06 — docs/antennas.md §7)"
    sample_rate: 2048000
    center_mhz: 161.0           # 2 MHz window covers 160–162 MHz (all BNSF channels)
    channel_config: railroad
    playback_priority: 1         # lower = more important; interrupts ham
    ppm: 0                      # calibrate per-device with kalibrate-rtl
    gain: null                  # null = AGC; set dB value to fix gain

  - id: marine
    serial: "RTLSDR_MRN"       # RTL-SDR.COM V3 #2
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "Marine VHF voice"
    antenna: "J-pole #3 (built, tested 2026-11-06 — docs/antennas.md §7)"
    sample_rate: 2048000
    center_mhz: 156.800         # 2 MHz window covers 155.8–157.8 MHz (priority channels)
    channel_config: marine
    playback_priority: 0         # lower = more important; interrupts ham
    ppm: 0
    gain: 40.0                  # fixed gain — AGC caused simultaneous false triggers
                                 # across nearly every channel (gain-hunting power steps).
                                 # Starting value; re-tune if real signals are weak/clipped.

  # P25 trunking (Pierce County fire/police) moved off this stack entirely —
  # handled by a standalone Uniden SDS200 scanner, not RTL-SDR/trunk-recorder.
  # SDS200 uses the same DPD 769-775 MHz omni antenna spec'd for this
  # project, fed directly (no LNA/multicoupler — single receiver, no
  # splitting needed). Of the two originally-planned NooElec v5 dongles, one
  # is reused below for ADS-B; the other (NooElec SMArTee v5) is reused for
  # AIS below — see `ais`.

  # ADS-B and AIS swapped dongles 2026-11-06. The SMArTee's bias-tee puts
  # ~4.5 V DC on its antenna jack, and a J-pole's shorted matching stub is a
  # DC short across the coax — so the J-pole (AIS) must not be on the
  # SMArTee. The 1090 MHz collinear measures open circuit (checked with a
  # multimeter), so it goes on the SMArTee, which can later also power a
  # filtered 1090 MHz LNA at the antenna over the coax.
  - id: adsb
    serial: "RTL_ADSB"          # NooElec SMArTee v5 — burned 2026-11-06 (was RTL_AIS).
                                 # Short serial: this dongle's longer product string
                                 # ("NESDR SMArTee v5") leaves less EEPROM space;
                                 # RTLSDR_ADSB / RTLSDR_AIS don't fit.
    model: "NooElec NESDR SMArTee v5 (bias-tee)"
    role: "ADS-B 1090 MHz aircraft tracking"
    antenna: "1090 MHz collinear (DC-open, safe with bias-tee — docs/antennas.md §7)"
    sample_rate: 2000000
    center_mhz: 1090.0
    channel_config: null        # dump1090 handles ADS-B; no scan loop needed
    ppm: 0
    gain: null

  - id: ais
    serial: "RTLSDR_AIS"        # NooElec SMArt v5 (no bias-tee) — burned 2026-11-06
                                 # (was RTLSDR_ADSB). AIS needs its own dongle:
                                 # rtl_ais wants exclusive access, and 161.975/162.025 MHz
                                 # is outside the marine voice dongle's window.
    model: "NooElec NESDR SMArt v5"
    role: "AIS vessel tracking — Commencement Bay"
    antenna: "J-pole #2 (DC short — keep off bias-tee dongles; docs/antennas.md §7)"
    sample_rate: 2048000
    center_mhz: 162.000          # covers both AIS ch 87B/88B: 161.975 / 162.025 MHz
    channel_config: null         # rtl_ais + src/display/ais_listener.py handle AIS directly
    ppm: 0
    gain: null

  - id: ham
    serial: "RTLSDR_HAM"       # burned 2026-11-06 (was factory default 00000001)
    model: "NooElec NESDR SMArt XTR v5 (E4000 tuner) + Ham It Up upconverter"
    role: "Shortwave broadcast (+ HAM) — receive only, day/night band switching"
    antenna: "Long wire → unun → Ham It Up → XTR (no counterpoise yet)"
    sample_rate: 2048000
    center_mhz: null             # set per band — day/night schedule in
                                  # config/channels/ham.yaml (`bands:`)
    upconverter_offset_mhz: 125.0 # Ham It Up LO — dongle tunes center + 125 MHz
    channel_config: ham
    ppm: 0
    gain: 30.0                   # fixed — a long wire can overload the E4000
                                  # on strong broadcasters; AGC hunts (see marine)
    max_segment_s: 30            # split continuous broadcasts into 30 s files
    playback_priority: 5         # background — marine/railroad interrupt it
    notes: >
      Receive only. E4000 tuning range starts ~52 MHz, so HF reception
      depends entirely on the Ham It Up: mode button set so only the "UP"
      LED is lit (upconvert, no amp), antenna on RF IN, XTR on IF OUT.
      Verified 2026-11-06: WWV 10/15 MHz and broadcasters received.
