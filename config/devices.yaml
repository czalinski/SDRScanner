# SDR Device Assignment Configuration
# Set serial numbers with: rtl_eeprom -d <index> -s <serial>
# Then update serial fields below to match.

devices:
  - id: railroad
    serial: "RTLSDR_RR"        # RTL-SDR.COM V3 #1
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "BNSF Railroad scanner"
    antenna: "160 MHz dipole / yagi"
    sample_rate: 2048000
    center_mhz: 161.0           # 2 MHz window covers 160–162 MHz (all BNSF channels)
    channel_config: railroad
    ppm: 0                      # calibrate per-device with kalibrate-rtl
    gain: null                  # null = AGC; set dB value to fix gain

  - id: marine
    serial: "RTLSDR_MRN"       # RTL-SDR.COM V3 #2
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "Marine VHF voice + AIS"
    antenna: "157 MHz vertical dipole"
    sample_rate: 2048000
    center_mhz: 156.800         # 2 MHz window covers 155.8–157.8 MHz (priority channels)
    channel_config: marine
    ppm: 0
    gain: null

  # P25 trunking (Pierce County fire/police) moved off this stack entirely —
  # handled by a standalone Uniden SDS200 scanner, not RTL-SDR/trunk-recorder.
  # The two NooElec v5 dongles previously planned for control/voice channels
  # are no longer needed for this project. SDS200 uses the same DPD
  # 769-775 MHz omni antenna, fed directly (no LNA/multicoupler — single
  # receiver, no splitting needed).

  - id: adsb
    serial: "RTLSDR_ADSB"      # Cheap RTL-SDR (to be purchased ~$25) — separate from NooElec v5s
    model: "RTL-SDR V3 or equivalent"
    role: "ADS-B 1090 MHz aircraft tracking"
    antenna: "1090 MHz spider ground plane"
    sample_rate: 2000000
    center_mhz: 1090.0
    channel_config: null        # dump1090 handles ADS-B; no scan loop needed
    ppm: 0
    gain: null
