# SDR Device Assignment Configuration
# Set serial numbers with: rtl_eeprom -d <index> -s <serial>
# Then update serial fields below to match.

devices:
  - id: railroad
    serial: "RTLSDR_RR"        # RTL-SDR.COM V3 #1
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "BNSF Railroad scanner"
    antenna: "160 MHz dipole / yagi"
    sample_rate: 2048000
    center_mhz: 161.0           # 2 MHz window covers 160–162 MHz (all BNSF channels)
    channel_config: railroad
    ppm: 0                      # calibrate per-device with kalibrate-rtl
    gain: null                  # null = AGC; set dB value to fix gain

  - id: marine
    serial: "RTLSDR_MRN"       # RTL-SDR.COM V3 #2
    model: "RTL-SDR.COM V3 (R820T2)"
    role: "Marine VHF voice + AIS"
    antenna: "157 MHz vertical dipole"
    sample_rate: 2048000
    center_mhz: 156.800         # 2 MHz window covers 155.8–157.8 MHz (priority channels)
    channel_config: marine
    ppm: 0
    gain: null

  - id: p25_control
    serial: "NOOELEC_P25"      # NooElec v5 #1 (pending) — locked on P25 control channel
    model: "NooElec RTL-SDR v5"
    role: "P25 trunking — control channel monitor"
    antenna: "860 MHz spider ground plane (8.7 cm elements) — shared via splitter"
    sample_rate: 2400000
    center_mhz: null            # TODO: set to P25 control channel freq from radioreference.com
    channel_config: null        # trunk-recorder manages this device directly
    ppm: 0
    gain: null

  - id: p25_voice
    serial: "NOOELEC_ADSB"     # NooElec v5 #2 (pending) — follows voice channel assignments
    model: "NooElec RTL-SDR v5"
    role: "P25 trunking — voice channel receiver"
    antenna: "860 MHz spider ground plane (8.7 cm elements) — shared via splitter"
    sample_rate: 2400000
    center_mhz: null            # trunk-recorder tunes this dynamically
    channel_config: null        # trunk-recorder manages this device directly
    ppm: 0
    gain: null
    notes: >
      Repurposed from ADSB role. ADS-B handled by a separate inexpensive RTL-SDR.
      Both Phase 1 (fire/IMBE) and Phase 2 (police/AMBE+2) decoded in software via mbelib.

  - id: adsb
    serial: "RTLSDR_ADSB"      # Cheap RTL-SDR (to be purchased ~$25) — separate from NooElec v5s
    model: "RTL-SDR V3 or equivalent"
    role: "ADS-B 1090 MHz aircraft tracking"
    antenna: "1090 MHz spider ground plane"
    sample_rate: 2000000
    center_mhz: 1090.0
    channel_config: null        # dump1090 handles ADS-B; no scan loop needed
    ppm: 0
    gain: null
